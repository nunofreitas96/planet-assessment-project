services:
  postgres:
    image: postgres:16-alpine
    container_name: planet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: planet
      POSTGRES_USER: planet
      POSTGRES_PASSWORD: planet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planet -d planet"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planet-assessment-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/planet
      SPRING_DATASOURCE_USERNAME: planet
      SPRING_DATASOURCE_PASSWORD: planet
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
